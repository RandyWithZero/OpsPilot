openapi: 3.1.0
info:
  title: OpsPilot Foundation Service API
  version: 0.3.0
  description: Foundation APIs for identity, projects, inventory, files, credential references, GitLab profiles, VCS operations, test/report records, and audit events. Protected routes require Authorization Bearer access tokens. Admin, Operator, and Viewer permissions are resolved by the IAM boundary; X-Actor-ID and X-Actor-Role are deprecated development-only compatibility headers.
servers:
  - url: http://localhost:8080
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy.
  /readyz:
    get:
      summary: Dependency readiness and safe diagnostics
      security: []
      description: Returns coarse dependency status, migration state, runtime queue counts, worker heartbeat summary, and non-sensitive record counts. This endpoint must not expose DSNs, tokens, credentials, storage keys, worker attempt tokens, or raw workflow output/error material.
      responses:
        "200":
          description: Dependency readiness diagnostics when required dependencies are ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies, metrics]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  dependencies:
                    type: object
                    additionalProperties:
                      type: object
                  metrics:
                    type: object
                    additionalProperties:
                      type: integer
        "503":
          description: Dependency readiness diagnostics when one or more required dependencies are degraded or unavailable.
          content:
            application/json:
              schema:
                type: object
                required: [status, dependencies, metrics]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  dependencies:
                    type: object
                    additionalProperties:
                      type: object
                  metrics:
                    type: object
                    additionalProperties:
                      type: integer
  /v1/auth/login:
    post:
      summary: Issue a local development user session
      security: []
      description: Development token issuer enabled only when OPSPILOT_AUTH_DEV_ISSUER=1. Production deployments should replace this issuer while preserving the response contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevLoginRequest"
      responses:
        "201":
          description: Issued session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed session tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/auth/logout:
    post:
      summary: Revoke the current user session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Session revocation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/service-identities:
    get:
      summary: List service identities
      responses:
        "200":
          description: Service identities without token material
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceIdentity"
    post:
      summary: Create a service identity and issue its initial worker token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceIdentityCreate"
      responses:
        "201":
          description: Created service identity with one-time token material
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceIdentityIssued"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /v1/service-identities/{serviceIdentityID}/token:
    post:
      summary: Issue a short-lived access token for a service identity
      security: []
      description: Authenticates with the service identity's one-time `service_token` in the request body. This worker/service token exchange does not require a human Admin bearer session.
      parameters:
        - name: serviceIdentityID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTokenRequest"
      responses:
        "200":
          description: Issued service bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /v1/service-identities/{serviceIdentityID}:
    delete:
      summary: Revoke a service identity
      parameters:
        - name: serviceIdentityID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked service identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "403":
          $ref: "#/components/responses/PermissionDenied"
  /v1/users:
    get:
      summary: List identity users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/users/{userID}:
    patch:
      summary: Update identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: Delete identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted user
  /v1/projects:
    get:
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: Create project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}:
    patch:
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted project
  /v1/projects/{projectID}/assets/{assetID}:
    post:
      summary: Link an asset to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Unlink an asset from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/environments/{environmentID}:
    post:
      summary: Link an environment to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Unlink an environment from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/repositories:
    post:
      summary: Link a GitLab repository to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryBinding"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/repositories/{profileID}/{repositoryID}:
    delete:
      summary: Unlink a GitLab repository from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: profileID
          in: path
          required: true
          schema:
            type: string
        - name: repositoryID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/assets:
    get:
      summary: List assets
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
        - name: environment_id
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: parent_id
          in: query
          schema:
            type: string
        - name: capability
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      summary: Create asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
  /v1/assets/{assetID}:
    patch:
      summary: Update asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      summary: Delete asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted asset
  /v1/environments:
    get:
      summary: List environments
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            enum: [DEV, QA, QE]
        - name: status
          in: query
          schema:
            type: string
        - name: asset_id
          in: query
          schema:
            type: string
        - name: member_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
    post:
      summary: Create environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreate"
      responses:
        "201":
          description: Created environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/environments/{environmentID}:
    patch:
      summary: Update environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreate"
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Delete environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted environment
  /v1/environments/{environmentID}/assets/{assetID}:
    post:
      summary: Bind a project-owned asset to an environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      summary: Unbind an asset from an environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/environments/{environmentID}/members/{userID}:
    post:
      summary: Bind a project member to an environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Unbind a non-owner member from an environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/environments/{environmentID}/files/{fileID}:
    post:
      summary: Bind a file reference to an environment
      description: The environment stores only file_ids. Storage keys remain internal to the file service. The actor must belong to the environment project and own the file. Files already bound to this environment are accepted; unbound files are claimed atomically; files bound to another resource are rejected.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Unbind a file reference from an environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/files:
    get:
      summary: List file metadata objects
      description: Non-admin callers are server-scoped to the authenticated actor ID as owner_id. Admin callers may filter across owners.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: owner_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            enum: [pending_upload, available, deleted]
      responses:
        "200":
          description: File objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileObject"
    post:
      summary: Create file metadata
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileObjectCreate"
      responses:
        "201":
          description: Created file object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
  /v1/files/upload:
    post:
      summary: Upload a file through the configured storage adapter
      description: Local MVP JSON uploads are capped by OPSPILOT_MAX_REQUEST_BODY_BYTES before parsing and OPSPILOT_MAX_FILE_UPLOAD_BYTES after base64 decode.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileUpload"
      responses:
        "201":
          description: Uploaded file object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
  /v1/files/{fileID}:
    delete:
      summary: Soft-delete a file object and remove its stored object when present
      description: Non-admin callers are server-scoped to the authenticated actor ID as owner_id. Admin callers may filter across owners.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
        - name: owner_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Deleted file object
  /v1/files/{fileID}/upload-grants:
    post:
      summary: Create an opaque upload grant for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Upload grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileGrant"
  /v1/files/{fileID}/upload-sessions:
    post:
      summary: Create an opaque upload session for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /v1/files/upload-sessions/{sessionID}/complete:
    post:
      summary: Mark an upload session complete
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionComplete"
      responses:
        "200":
          description: Completed upload session and updated file object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionCompleteResponse"
  /v1/files/{fileID}/download-grants:
    post:
      summary: Create an opaque download grant for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Download grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileGrant"
  /v1/files/{fileID}/download:
    get:
      summary: Download a file through a controlled response
      description: Non-admin callers are server-scoped to the authenticated actor ID as owner_id. Admin callers may filter across owners.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
        - name: owner_id
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: module
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Download payload with public metadata and base64 content
          content:
            application/json:
              schema:
