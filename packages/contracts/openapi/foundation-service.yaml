          application/json:
            schema:
              $ref: "#/components/schemas/TestRunCreate"
      responses:
        "201":
          description: Created test run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRun"
  /v1/test-runs/{runID}:
    patch:
      summary: Update test run status/results
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: runID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestRunUpdate"
      responses:
        "200":
          description: Updated test run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestRun"
  /v1/test-runs/{runID}/artifacts:
    post:
      summary: Ingest test run artifacts and create a report
      description: Uploads report artifacts for a test run, stores file refs without exposing storage keys, parses JUnit XML or JSON summaries when present, updates the test run, and upserts the automated quality gate.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: runID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactIngestRequest"
      responses:
        "201":
          description: Ingested artifacts and report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactIngestResponse"
  /v1/reports:
    get:
      summary: List reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      summary: Create report
      description: Attached file_ids must reference available files owned by the report project owner/member scope and bound to either the same project or the report test_run_id.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "201":
          description: Created report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
  /v1/quality-gates:
    get:
      summary: List quality gates
      responses:
        "200":
          description: Quality gates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityGate"
    post:
      summary: Create quality gate
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QualityGateCreate"
      responses:
        "201":
          description: Created quality gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityGate"
  /v1/audit-events:
    get:
      summary: List audit events, newest first
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpsPilot-HMAC
  parameters:
    ActorID:
      name: X-Actor-ID
      in: header
      required: false
      deprecated: true
      schema:
        type: string
      description: Deprecated development-only actor ID. Ignored unless OPSPILOT_AUTH_DEV_HEADERS=1; production callers must use Authorization Bearer tokens.
    ActorRole:
      name: X-Actor-Role
      in: header
      required: false
      deprecated: true
      schema:
        type: string
        enum: [Admin, Operator, Viewer]
      description: Deprecated development-only role context. Ignored unless OPSPILOT_AUTH_DEV_HEADERS=1. Admin may manage secrets, GitLab profiles, model/agent/skill configuration, and destructive/archive actions; Operator may run workflows, claim/callback runtime tasks, and perform operational file/VCS actions; Viewer is read-only.
    GitLabWebhookToken:
      name: X-Gitlab-Token
      in: header
      required: false
      schema:
        type: string
      description: GitLab webhook secret token. Prefer this header over a request-body token; it is validated against the profile webhook secret, not the outbound GitLab API credential.
  responses:
    AuthenticationRequired:
      description: Missing, invalid, expired, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflicts with an existing value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: Actor role is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Role:
      type: object
      required: [scope, name]
      properties:
        scope:
          type: string
          examples: [platform, project]
        name:
          type: string
          examples: [Admin, Operator, Viewer]
    DevLoginRequest:
      type: object
      required: [role]
      properties:
        actor_id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/RoleName"
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
        session_id:
          type: string
    AccessTokenResponse:
      type: object
      required: [access_token, access_token_expires_at, token_type]
      properties:
        access_token:
          type: string
        access_token_expires_at:
          type: string
          format: date-time
        token_type:
          type: string
          const: Bearer
    AuthTokenResponse:
      allOf:
        - $ref: "#/components/schemas/AccessTokenResponse"
        - type: object
          required: [refresh_token, refresh_token_expires_at]
          properties:
            refresh_token:
              type: string
            refresh_token_expires_at:
              type: string
              format: date-time
            session_id:
              type: string
    ServiceIdentityCreate:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          $ref: "#/components/schemas/RoleName"
        project_ids:
          type: array
          description: Project IDs this service identity may access for project-scoped operations. Required for artifact/report ingestion.
          items:
            type: string
        access_token_ttl_seconds:
          type: integer
          minimum: 1
    ServiceIdentity:
      type: object
      required: [id, name, role, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/RoleName"
        project_ids:
          type: array
          items:
            type: string
        status:
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ServiceIdentityIssued:
      allOf:
        - $ref: "#/components/schemas/ServiceIdentity"
        - $ref: "#/components/schemas/AccessTokenResponse"
        - type: object
          required: [service_token]
          properties:
            service_token:
              type: string
              description: One-time service secret. Store securely; list responses never return it.
    ServiceTokenRequest:
      type: object
      required: [service_token]
      properties:
        service_token:
          type: string
        access_token_ttl_seconds:
          type: integer
          minimum: 1
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    RoleName:
      type: string
      enum: [Admin, Operator, Viewer]
    UserCreate:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        status:
          enum: [active, inactive]
    User:
      allOf:
        - $ref: "#/components/schemas/UserCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [active, inactive]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProjectCreate:
      type: object
      required: [key, name, owner_id]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
        member_ids:
          type: array
          items:
            type: string
        status:
          enum: [active, archived]
        repository_bindings:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryBinding"
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [active, archived]
            asset_ids:
              type: array
              items:
                type: string
            environment_ids:
              type: array
              items:
                type: string
            repository_bindings:
              type: array
              items:
                $ref: "#/components/schemas/RepositoryBinding"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AssetCreate:
      type: object
      required: [category, name]
      properties:
        category:
          type: string
          examples: [server, workstation, vm, gpu, memory]
        name:
          type: string
        status:
          enum: [available, in_use, maintenance, retired]
        owner_id:
          type: string
        location:
          type: string
        parent_id:
          type: string
        capabilities:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        file_ids:
          type: array
          description: File-service references attached to this asset. Internal storage keys are never exposed.
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Endpoint:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
    EnvironmentCreate:
      type: object
      required: [project_id, name, type, owner_id]
      properties:
        project_id:
          type: string
        name:
          type: string
        type:
          enum: [DEV, QA, QE]
        status:
          enum: [active, inactive]
        owner_id:
          type: string
        member_ids:
          type: array
          items:
            type: string
        asset_ids:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        file_ids:
          type: array
          description: File-service references attached to this environment. Internal storage keys are never exposed.
          items:
            type: string
    Environment:
      allOf:
        - $ref: "#/components/schemas/EnvironmentCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    FileObjectCreate:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        owner_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        module:
          type: string
    FileUpload:
      type: object
      required: [filename, content_type, content_base64]
      properties:
        filename:
          type: string
        content_type:
          type: string
        owner_id:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        module:
          type: string
        content_base64:
          type: string
          description: Base64 encoded file bytes for the local MVP upload path. The service calculates size_bytes and checksum. Default decoded limit is 5 MiB via OPSPILOT_MAX_FILE_UPLOAD_BYTES.
    FileObject:
      allOf:
        - $ref: "#/components/schemas/FileObjectCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [pending_upload, available, deleted]
            checksum:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
            deleted_by:
              type: string
    FileDownload:
      type: object
      required: [file, content_base64]
      properties:
        file:
          $ref: "#/components/schemas/FileObject"
        content_base64:
          type: string
    FileGrant:
      type: object
      required: [file_id, method, url, expires_in_seconds]
      properties:
        file_id:
          type: string
        method:
          enum: [GET, PUT]
        url:
          type: string
          description: Opaque storage-boundary capability URL. It does not expose provider internals or storage keys.
        expires_in_seconds:
          type: integer
    UploadSession:
      type: object
      required: [id, file_id, method, status, url, expires_in_seconds, created_at, updated_at]
      properties:
        id:
          type: string
        file_id:
          type: string
        method:
          enum: [PUT]
        status:
          enum: [open, completed, cancelled]
        url:
          type: string
        expires_in_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UploadSessionComplete:
      type: object
      properties:
        checksum:
          type: string
        size_bytes:
          type: integer
          minimum: 0
    UploadSessionCompleteResponse:
      type: object
      required: [upload_session, file]
      properties:
        upload_session:
          $ref: "#/components/schemas/UploadSession"
        file:
          $ref: "#/components/schemas/FileObject"
    CredentialCreate:
      type: object
      required: [provider, name, secret]
      properties:
        provider:
          enum: [gitlab, model_provider]
        name:
          type: string
        secret:
          type: string
          writeOnly: true
        status:
          enum: [active, inactive]
    CredentialUpdate:
      type: object
      properties:
        name:
          type: string
        secret:
          type: string
          writeOnly: true
          description: Optional secret rotation value. Omit for metadata-only updates.
        status:
          enum: [active, inactive]
    CredentialReference:
      type: object
      required: [id, provider, name, secret_ref, secret_fingerprint, status, created_at, updated_at]
      description: Credential reference response. Raw secret material is never returned; secret_ref is an opaque local vault reference, not a decryptable key.
      properties:
        id:
          type: string
        provider:
          type: string
        name:
          type: string
        secret_ref:
          type: string
          description: Opaque reference to local secret-store material.
        secret_fingerprint:
          type: string
          description: HMAC-SHA256 based fingerprint for rotation/change detection.
        status:
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitLabRepository:
      type: object
      required: [id, path, name, web_url]
      properties:
        id:
          type: string
        path:
          type: string
        name:
          type: string
        web_url:
          type: string
    GitLabRepositoryPage:
      type: object
      required: [items, page, per_page, total, has_next, last_synced_at]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GitLabRepository"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        has_next:
          type: boolean
        last_synced_at:
          type: string
          description: Empty until the profile has synced repositories.
    GitLabRepositorySyncRequest:
      type: object
      properties:
        search:
          type: string
        page:
          type: integer
          default: 1
        per_page:
          type: integer
          default: 20
    GitLabBranch:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default:
          type: boolean
        protected:
          type: boolean
        ref:
          type: string
    GitLabBranchList:
      type: object
      required: [repository, branches]
      properties:
        repository:
          $ref: "#/components/schemas/GitLabRepository"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/GitLabBranch"
    GitLabBranchCreate:
      type: object
      required: [project_id, branch, ref]
      properties:
        project_id:
          type: string
          description: OpsPilot project that has this repository bound. Actor must own or belong to the project before the stored GitLab credential is used.
        branch:
          type: string
        ref:
          type: string
    GitLabMergeRequestCreate:
      type: object
      required: [project_id, source_branch, target_branch, title]
      properties:
        project_id:
          type: string
          description: OpsPilot project that has this repository bound. Actor must own or belong to the project before the stored GitLab credential is used.
        source_branch:
          type: string
        target_branch:
          type: string
        title:
          type: string
    GitLabMergeRequest:
      type: object
      required: [iid, state, source_branch, target_branch, title]
      properties:
        iid:
          type: string
        state:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        title:
          type: string
        web_url:
          type: string
    GitLabMergeRequestStatus:
      type: object
      required: [repository, merge_request]
      properties:
        repository:
          $ref: "#/components/schemas/GitLabRepository"
        merge_request:
          $ref: "#/components/schemas/GitLabMergeRequest"
    GitLabProfileCreate:
      type: object
      required: [name, base_url, credential_ref_id]
      properties:
        name:
          type: string
        base_url:
          type: string
        credential_ref_id:
          type: string
        webhook_secret:
          type: string
          writeOnly: true
          description: Optional GitLab webhook secret. Stored separately from the outbound API credential and never returned.
        status:
          enum: [active, inactive]
    GitLabProfileUpdate:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        credential_ref_id:
          type: string
        webhook_secret:
          type: string
          writeOnly: true
          description: Rotates or creates the separate GitLab webhook secret.
        status:
          enum: [active, inactive]
    GitLabProfile:
      type: object
      required: [id, name, base_url, credential_ref_id, repository_selection, repository_synced_at, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        credential_ref_id:
          type: string
        webhook_secret_ref:
          type: string
          description: Server-side reference for the separate webhook secret, when configured. The secret value is never returned.
        repository_selection:
          type: array
          readOnly: true
          description: Last synced repository discovery results. Clients cannot author this catalog through profile create/update.
          items:
            $ref: "#/components/schemas/GitLabRepository"
        repository_synced_at:
          type: string
          description: Empty until repository discovery has synced successfully.
        status:
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RepositoryBinding:
      type: object
      required: [provider, profile_id, repository_id]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
    VCSOperationCreate:
      type: object
      required: [provider, profile_id, repository_id, operation_type]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        operation_type:
          enum: [create_branch, open_merge_request, merge_merge_request, read_branches, read_merge_request]
        branch:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        title:
          type: string
        external_id:
          type: string
    VCSOperation:
      allOf:
        - $ref: "#/components/schemas/VCSOperationCreate"
        - type: object
          required: [id, status, result, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [queued, completed, failed]
            result:
              type: object
              additionalProperties: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VCSWebhookEventCreate:
      type: object
      required: [provider, profile_id, event_type, authenticity_token]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        event_type:
          type: string
        authenticity_token:
          type: string
          writeOnly: true
          description: GitLab webhook token checked against the profile webhook secret; never stored or returned. Prefer the X-Gitlab-Token header for real webhook deliveries.
        payload:
          type: object
          description: Payload is recursively redacted before persistence or response.
          additionalProperties: true
    VCSWebhookEvent:
      type: object
      required: [id, provider, profile_id, event_type, status, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          description: Redacted payload summary retained after authenticity validation.
          additionalProperties: true
        status:
          enum: [received, processed, rejected]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        description:
          type: string
        status:
          enum: [active, inactive]
        capabilities:
          type: array
          items:
            type: string
        skill_ids:
          type: array
          items:
            type: string
        model_provider_id:
          type: string
    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SkillCreate:
      type: object
      required: [name, version, runtime]
      properties:
        name:
          type: string
        version:
          type: string
        runtime:
          type: string
        description:
          type: string
        status:
          enum: [active, deprecated]
        capabilities:
          type: array
          items:
            type: string
        package_file_id:
          type: string
    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ModelProviderCreate:
      type: object
      required: [provider, name, credential_ref_id]
      properties:
        provider:
          type: string
        name:
          type: string
        credential_ref_id:
          type: string
          description: Safe credential reference created with provider=model_provider.
        base_url:
          type: string
        models:
          type: array
          items:
            type: string
        status:
          enum: [active, inactive]
    ModelProvider:
      allOf:
        - $ref: "#/components/schemas/ModelProviderCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowDefinitionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        project_id:
          type: string
        status:
          enum: [draft, active, archived]
        active_version_id:
          type: string
    WorkflowDefinition:
      allOf:
        - $ref: "#/components/schemas/WorkflowDefinitionCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          enum: [trigger, agent_task, skill_task, approval, notification, manual, manual_task, result]
        name:
          type: string
        agent_id:
          type: string
        skill_id:
          type: string
        model_provider_id:
          type: string
        config:
          type: object
          additionalProperties: true
    WorkflowEdge:
      type: object
      required: [from_node_id, to_node_id]
      properties:
        from_node_id:
          type: string
        to_node_id:
          type: string
        condition:
          type: string
    WorkflowVersionCreate:
      type: object
      required: [version]
      properties:
        version:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        status:
          enum: [draft, active, deprecated]
    WorkflowVersion:
      allOf:
        - $ref: "#/components/schemas/WorkflowVersionCreate"
        - type: object
          required: [id, workflow_id, status, created_at, updated_at]
          properties:
            id:
              type: string
            workflow_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowRunCreate:
      type: object
      properties:
        workflow_version_id:
          type: string
          description: Optional explicit version. Defaults to the workflow active_version_id.
        trigger_type:
          enum: [manual]
        start:
          type: boolean
          description: If true, create and immediately manually start the run.
    WorkflowStepRunUpdate:
      type: object
      required: [status]
      properties:
        status:
          enum: [running, completed, failed, skipped]
          description: Manual/approval step runs cannot be skipped; downstream steps require predecessors to be terminal in an allowed state.
        output:
          type: object
          additionalProperties: true
        error:
          type: string
    WorkflowStepRun:
      type: object
      required: [id, workflow_run_id, workflow_id, workflow_version_id, node_id, node_type, step_type, sequence, predecessor_node_ids, status, created_at, updated_at]
      properties:
        id:
          type: string
        workflow_run_id:
          type: string
        workflow_id:
          type: string
        workflow_version_id:
          type: string
        node_id:
          type: string
        node_type:
          type: string
        step_type:
          enum: [trigger, agent, manual, result]
        sequence:
          type: integer
        name:
          type: string
        status:
          enum: [pending, running, completed, failed, skipped]
        agent_id:
          type: string
        skill_id:
          type: string
        model_provider_id:
          type: string
        predecessor_node_ids:
          type: array
          description: Immutable predecessor node IDs snapshotted from workflow version edges when the run is created.
          items:
            type: string
        input:
          type: object
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        error:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowRuntimeTask:
      type: object
      required: [id, workflow_run_id, workflow_step_run_id, workflow_id, workflow_version_id, node_id, agent_id, status, attempt, max_attempts, input_summary, created_at, updated_at]
      properties:
        id:
          type: string
        workflow_run_id:
          type: string
        workflow_step_run_id:
          type: string
        workflow_id:
          type: string
        workflow_version_id:
          type: string
        node_id:
          type: string
        agent_id:
          type: string
        skill_id:
          type: string
        model_provider_id:
          type: string
          description: Model provider reference ID only; credentials and model keys are never included.
        status:
          enum: [queued, running, completed, failed, cancelled, timed_out]
        attempt:
          type: integer
        max_attempts:
          type: integer
        input_summary:
          type: object
          description: Sanitized binding summary with IDs and binding names only, not credential/model key values.
          additionalProperties: true
        output:
          type: object
          additionalProperties: true
        error:
          type: string
        timeout_seconds:
          type: integer
        worker_id:
          type: string
          description: Worker instance that most recently claimed the task.
        heartbeat_at:
          type: string
          format: date-time
        lease_expires_at:
          type: string
          format: date-time
          description: When the current running claim expires. Expired running tasks are requeued with a rotated attempt token.
        claimed_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowRuntimeTaskClaimed:
      allOf:
        - $ref: "#/components/schemas/WorkflowRuntimeTask"
        - type: object
          required: [attempt_token]
          properties:
            attempt_token:
              type: string
              description: Idempotency token for this concrete attempt; only returned by the authorized claim path and required on callbacks.
    RuntimeTaskClaim:
      type: object
      properties:
        agent_id:
          type: string
          description: Optional worker filter; omitted claims the oldest queued task.
        worker_id:
          type: string
          description: Optional worker instance ID recorded on the running lease.
        lease_seconds:
          type: integer
          description: Positive lease duration for the claim. Defaults to 60 seconds.
    RuntimeTaskCallback:
      type: object
      required: [attempt_token, status]
      properties:
        attempt_token:
          type: string
        status:
          enum: [running, completed, failed]
        output:
          type: object
          additionalProperties: true
        error:
          type: string
        retry:
          type: boolean
          description: On failed callbacks, enqueue another attempt when max_attempts allows.
        lease_seconds:
          type: integer
          description: On running callbacks, renew the lease for this many seconds.
    WorkflowRun:
      type: object
      required: [id, workflow_id, workflow_version_id, trigger_type, status, steps, created_at, updated_at]
      properties:
        id:
          type: string
        workflow_id:
          type: string
        workflow_version_id:
          type: string
        trigger_type:
          enum: [manual]
        status:
          enum: [created, running, completed, failed, cancelled]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStepRun"
    TestCaseCreate:
      type: object
      required: [project_id, name]
      properties:
        project_id:
          type: string
        name:
          type: string
        case_type:
          enum: [manual, automated]
        priority:
          enum: [low, medium, high, critical]
        status:
          enum: [active, inactive, deprecated]
        steps:
          type: array
          items:
            type: object
            additionalProperties: true
    TestCase:
      allOf:
        - $ref: "#/components/schemas/TestCaseCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    TestSuiteCreate:
