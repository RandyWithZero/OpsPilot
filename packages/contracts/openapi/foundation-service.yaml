components:
  parameters:
    ActorID:
      name: X-Actor-ID
      in: header
      required: false
      schema:
        type: string
      description: Actor ID recorded on audit events. Auth middleware will replace this development header.
    ActorRole:
      name: X-Actor-Role
      in: header
      required: false
      schema:
        type: string
        enum: [Admin, Operator, Viewer]
      description: Local MVP role context. Admin may manage secrets, GitLab profiles, and destructive/archive actions; Operator may perform operational workflow/file/VCS actions; Viewer is read-only. Omitted locally defaults to Admin for development compatibility.
  responses:
    Conflict:
      description: Resource conflicts with an existing value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PermissionDenied:
      description: Actor role is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Role:
      type: object
      required: [scope, name]
      properties:
        scope:
          type: string
          examples: [platform, project]
        name:
          type: string
          examples: [Admin, Operator, Viewer]
    UserCreate:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        status:
          enum: [active, inactive]
    User:
      allOf:
        - $ref: "#/components/schemas/UserCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [active, inactive]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ProjectCreate:
      type: object
      required: [key, name, owner_id]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
        member_ids:
          type: array
          items:
            type: string
        status:
          enum: [active, archived]
        repository_bindings:
          type: array
          items:
            $ref: "#/components/schemas/RepositoryBinding"
    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [active, archived]
            asset_ids:
              type: array
              items:
                type: string
            environment_ids:
              type: array
              items:
                type: string
            repository_bindings:
              type: array
              items:
                $ref: "#/components/schemas/RepositoryBinding"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AssetCreate:
      type: object
      required: [category, name]
      properties:
        category:
          type: string
          examples: [server, workstation, vm, gpu, memory]
        name:
          type: string
        status:
          enum: [available, in_use, maintenance, retired]
        owner_id:
          type: string
        location:
          type: string
        parent_id:
          type: string
        capabilities:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: true
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Endpoint:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
    EnvironmentCreate:
      type: object
      required: [project_id, name, type, owner_id]
      properties:
        project_id:
          type: string
        name:
          type: string
        type:
          enum: [DEV, QA, QE]
        status:
          enum: [active, inactive]
        owner_id:
          type: string
        member_ids:
          type: array
          items:
            type: string
        asset_ids:
          type: array
          items:
            type: string
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
    Environment:
      allOf:
        - $ref: "#/components/schemas/EnvironmentCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    FileObjectCreate:
      type: object
      required: [filename, content_type, size_bytes]
      properties:
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        owner_id:
          type: string
    FileObject:
      allOf:
        - $ref: "#/components/schemas/FileObjectCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [pending_upload, available, deleted]
            checksum:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    FileGrant:
      type: object
      required: [file_id, method, url, expires_in_seconds]
      properties:
        file_id:
          type: string
        method:
          enum: [GET, PUT]
        url:
          type: string
        expires_in_seconds:
          type: integer
    UploadSession:
      type: object
      required: [id, file_id, method, status, url, expires_in_seconds, created_at, updated_at]
      properties:
        id:
          type: string
        file_id:
          type: string
        method:
          enum: [PUT]
        status:
          enum: [open, completed, cancelled]
        url:
          type: string
        expires_in_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UploadSessionComplete:
      type: object
      properties:
        checksum:
          type: string
        size_bytes:
          type: integer
          minimum: 0
    UploadSessionCompleteResponse:
      type: object
      required: [upload_session, file]
      properties:
        upload_session:
          $ref: "#/components/schemas/UploadSession"
        file:
          $ref: "#/components/schemas/FileObject"
    CredentialCreate:
      type: object
      required: [provider, name, secret]
      properties:
        provider:
          enum: [gitlab, model_provider]
        name:
          type: string
        secret:
          type: string
          writeOnly: true
        status:
          enum: [active, inactive]
    CredentialUpdate:
      type: object
      properties:
        name:
          type: string
        secret:
          type: string
          writeOnly: true
          description: Optional secret rotation value. Omit for metadata-only updates.
        status:
          enum: [active, inactive]
    CredentialReference:
      type: object
      required: [id, provider, name, secret_ref, secret_fingerprint, status, created_at, updated_at]
      description: Credential reference response. Raw secret material is never returned; secret_ref is an opaque local vault reference, not a decryptable key.
      properties:
        id:
          type: string
        provider:
          type: string
        name:
          type: string
        secret_ref:
          type: string
          description: Opaque reference to local secret-store material.
        secret_fingerprint:
          type: string
          description: HMAC-SHA256 based fingerprint for rotation/change detection.
        status:
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GitLabRepository:
      type: object
      required: [id, path, name, web_url]
      properties:
        id:
          type: string
        path:
          type: string
        name:
          type: string
        web_url:
          type: string
    GitLabProfileCreate:
      type: object
      required: [name, base_url, credential_ref_id]
      properties:
        name:
          type: string
        base_url:
          type: string
        credential_ref_id:
          type: string
        repository_selection:
          type: array
          items:
            $ref: "#/components/schemas/GitLabRepository"
        status:
          enum: [active, inactive]
    GitLabProfileUpdate:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        credential_ref_id:
          type: string
        repository_selection:
          type: array
          items:
            $ref: "#/components/schemas/GitLabRepository"
        status:
          enum: [active, inactive]
    GitLabProfile:
      allOf:
        - $ref: "#/components/schemas/GitLabProfileCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    RepositoryBinding:
      type: object
      required: [provider, profile_id, repository_id]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        path:
          type: string
          description: Optional request field. The service infers and returns the selected repository path.
        web_url:
          type: string
    VCSOperationCreate:
      type: object
      required: [provider, profile_id, repository_id, operation_type]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        operation_type:
          enum: [create_branch, open_merge_request, merge_merge_request]
        branch:
          type: string
        source_branch:
          type: string
        target_branch:
          type: string
        title:
          type: string
        external_id:
          type: string
    VCSOperation:
      allOf:
        - $ref: "#/components/schemas/VCSOperationCreate"
        - type: object
          required: [id, status, result, created_at, updated_at]
          properties:
            id:
              type: string
            status:
              enum: [queued, completed, failed]
            result:
              type: object
              additionalProperties: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    VCSWebhookEventCreate:
      type: object
      required: [provider, profile_id, event_type, authenticity_token]
      properties:
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        event_type:
          type: string
        authenticity_token:
          type: string
          writeOnly: true
          description: GitLab webhook token checked against the profile credential; never stored or returned.
        payload:
          type: object
          description: Payload is recursively redacted before persistence or response.
          additionalProperties: true
    VCSWebhookEvent:
      type: object
      required: [id, provider, profile_id, event_type, status, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          enum: [gitlab]
        profile_id:
          type: string
        repository_id:
          type: string
        event_type:
          type: string
        payload:
          type: object
          description: Redacted payload summary retained after authenticity validation.
          additionalProperties: true
        status:
          enum: [received, processed, rejected]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
        description:
          type: string
        status:
          enum: [active, inactive]
        capabilities:
          type: array
          items:
            type: string
        skill_ids:
          type: array
          items:
            type: string
        model_provider_id:
          type: string
    Agent:
      allOf:
        - $ref: "#/components/schemas/AgentCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    SkillCreate:
      type: object
      required: [name, version, runtime]
      properties:
        name:
          type: string
        version:
          type: string
        runtime:
          type: string
        description:
          type: string
        status:
          enum: [active, deprecated]
        capabilities:
          type: array
          items:
            type: string
        package_file_id:
          type: string
    Skill:
      allOf:
        - $ref: "#/components/schemas/SkillCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ModelProviderCreate:
      type: object
      required: [provider, name, credential_ref_id]
      properties:
        provider:
          type: string
        name:
          type: string
        credential_ref_id:
          type: string
          description: Safe credential reference created with provider=model_provider.
        base_url:
          type: string
        models:
          type: array
          items:
            type: string
        status:
          enum: [active, inactive]
    ModelProvider:
      allOf:
        - $ref: "#/components/schemas/ModelProviderCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowDefinitionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        project_id:
          type: string
        status:
          enum: [draft, active, archived]
        active_version_id:
          type: string
    WorkflowDefinition:
      allOf:
        - $ref: "#/components/schemas/WorkflowDefinitionCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          enum: [trigger, agent_task, skill_task, approval, notification, manual, manual_task, result]
        name:
          type: string
        agent_id:
          type: string
        skill_id:
          type: string
        model_provider_id:
          type: string
        config:
          type: object
          additionalProperties: true
    WorkflowEdge:
      type: object
      required: [from_node_id, to_node_id]
      properties:
        from_node_id:
          type: string
        to_node_id:
          type: string
        condition:
          type: string
    WorkflowVersionCreate:
      type: object
      required: [version]
      properties:
        version:
          type: string
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowEdge"
        status:
          enum: [draft, active, deprecated]
    WorkflowVersion:
      allOf:
        - $ref: "#/components/schemas/WorkflowVersionCreate"
        - type: object
          required: [id, workflow_id, status, created_at, updated_at]
          properties:
            id:
              type: string
            workflow_id:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    WorkflowRunCreate:
      type: object
      properties:
        workflow_version_id:
          type: string
          description: Optional explicit version. Defaults to the workflow active_version_id.
        trigger_type:
          enum: [manual]
        start:
          type: boolean
          description: If true, create and immediately manually start the run.
    WorkflowStepRunUpdate:
      type: object
      required: [status]
