        content_type:
          type: string
        artifact_type:
          enum: [junit, json, html, log]
        content_base64:
          type: string
          description: Base64 encoded artifact bytes. Default decoded limit is 5 MiB via OPSPILOT_MAX_FILE_UPLOAD_BYTES.
