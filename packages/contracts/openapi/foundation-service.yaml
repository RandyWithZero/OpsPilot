          type: string
        file_ids:
          type: array
          description: Available file refs scoped to this report project. Each file must be owned by a project owner/member, use module reports or the report_type, and bind to resource_type/resource_id of the project or test_run_id.
          items:
            type: string
        summary:
          type: object
          additionalProperties: true
