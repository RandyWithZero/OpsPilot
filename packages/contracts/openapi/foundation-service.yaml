openapi: 3.1.0
info:
  title: OpsPilot Foundation Service API
  version: 0.3.0
  description: Foundation APIs for identity, projects, inventory, files, credential references, GitLab profiles, VCS operations, test/report records, and audit events. Local MVP RBAC uses X-Actor-ID plus X-Actor-Role headers; supported roles are Admin, Operator, and Viewer.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy.
  /v1/users:
    get:
      summary: List identity users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      summary: Create identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/users/{userID}:
    patch:
      summary: Update identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: Delete identity user
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: userID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted user
  /v1/projects:
    get:
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      summary: Create project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}:
    patch:
      summary: Update project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Delete project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted project
  /v1/projects/{projectID}/assets/{assetID}:
    post:
      summary: Link an asset to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Unlink an asset from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/environments/{environmentID}:
    post:
      summary: Link an environment to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      summary: Unlink an environment from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/repositories:
    post:
      summary: Link a GitLab repository to a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryBinding"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/projects/{projectID}/repositories/{profileID}/{repositoryID}:
    delete:
      summary: Unlink a GitLab repository from a project
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: profileID
          in: path
          required: true
          schema:
            type: string
        - name: repositoryID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /v1/assets:
    get:
      summary: List assets
      responses:
        "200":
          description: Assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      summary: Create asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Created asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
  /v1/assets/{assetID}:
    patch:
      summary: Update asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      summary: Delete asset
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: assetID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted asset
  /v1/environments:
    get:
      summary: List environments
      responses:
        "200":
          description: Environments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Environment"
    post:
      summary: Create environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreate"
      responses:
        "201":
          description: Created environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /v1/environments/{environmentID}:
    patch:
      summary: Update environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentCreate"
      responses:
        "200":
          description: Updated environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
    delete:
      summary: Delete environment
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted environment
  /v1/files:
    get:
      summary: List file metadata objects
      responses:
        "200":
          description: File objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileObject"
    post:
      summary: Create file metadata
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileObjectCreate"
      responses:
        "201":
          description: Created file object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileObject"
  /v1/files/{fileID}/upload-grants:
    post:
      summary: Create a local upload grant for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Upload grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileGrant"
  /v1/files/{fileID}/upload-sessions:
    post:
      summary: Create a local upload session for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
  /v1/files/upload-sessions/{sessionID}/complete:
    post:
      summary: Mark a local upload session complete
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionComplete"
      responses:
        "200":
          description: Completed upload session and updated file object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionCompleteResponse"
  /v1/files/{fileID}/download-grants:
    post:
      summary: Create a local download grant for a file object
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: fileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Download grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileGrant"
  /v1/credentials:
    get:
      summary: List credential references
      description: Returns credential references only. Secret material is never returned.
      responses:
        "200":
          description: Credential references
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CredentialReference"
    post:
      summary: Create a credential reference from a secret
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreate"
      responses:
        "201":
          description: Created credential reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReference"
  /v1/credentials/{credentialID}:
    patch:
      summary: Update credential metadata or rotate secret
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: credentialID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Updated credential reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialReference"
    delete:
      summary: Delete credential reference
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: credentialID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted credential
  /v1/gitlab/profiles:
    get:
      summary: List GitLab API profiles
      responses:
        "200":
          description: GitLab profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitLabProfile"
    post:
      summary: Create GitLab API profile
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitLabProfileCreate"
      responses:
        "201":
          description: Created GitLab profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabProfile"
  /v1/gitlab/profiles/{profileID}:
    patch:
      summary: Update GitLab API profile
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: profileID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitLabProfileUpdate"
      responses:
        "200":
          description: Updated GitLab profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitLabProfile"
    delete:
      summary: Delete GitLab API profile
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: profileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted GitLab profile
  /v1/gitlab/profiles/{profileID}/repositories:
    get:
      summary: List selectable repositories for a GitLab profile
      description: Local MVP adapter returns configured repository selection or deterministic stub repositories.
      parameters:
        - name: profileID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitLabRepository"
  /v1/vcs/operations:
    get:
      summary: List local VCS operation records
      responses:
        "200":
          description: VCS operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VCSOperation"
    post:
      summary: Queue a GitLab VCS operation through the local adapter boundary
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VCSOperationCreate"
      responses:
        "201":
          description: Created VCS operation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCSOperation"
  /v1/vcs/webhook-events:
    get:
      summary: List received VCS webhook events
      responses:
        "200":
          description: Webhook events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VCSWebhookEvent"
    post:
      summary: Record a GitLab webhook event
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VCSWebhookEventCreate"
      responses:
        "201":
          description: Created webhook event record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VCSWebhookEvent"
  /v1/agents:
    get:
      summary: List agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      summary: Create agent
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /v1/agents/{agentID}:
    patch:
      summary: Update agent
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      summary: Delete agent
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: agentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted agent
  /v1/skills:
    get:
      summary: List skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      summary: Create skill
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "201":
          description: Created skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
  /v1/skills/{skillID}:
    patch:
      summary: Update skill
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: skillID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillCreate"
      responses:
        "200":
          description: Updated skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
    delete:
      summary: Delete skill
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: skillID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted skill
  /v1/model-providers:
    get:
      summary: List model providers
      responses:
        "200":
          description: Model providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelProvider"
    post:
      summary: Create model provider
      description: Uses a safe credential reference. Raw model API keys are created through /v1/credentials and are never returned here.
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderCreate"
      responses:
        "201":
          description: Created model provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProvider"
  /v1/model-providers/{providerID}:
    patch:
      summary: Update model provider
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: providerID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelProviderCreate"
      responses:
        "200":
          description: Updated model provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelProvider"
    delete:
      summary: Delete model provider
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: providerID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted model provider
  /v1/workflows:
    get:
      summary: List workflow definitions
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinition"
    post:
      summary: Create workflow definition
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionCreate"
      responses:
        "201":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
  /v1/workflows/{workflowID}:
    patch:
      summary: Update workflow definition
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: workflowID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionCreate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
    delete:
      summary: Delete workflow definition
      parameters:
        - $ref: "#/components/parameters/ActorID"
        - $ref: "#/components/parameters/ActorRole"
        - name: workflowID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted workflow
  /v1/workflows/{workflowID}/versions:
    get:
      summary: List workflow versions
      parameters:
        - name: workflowID
