services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: opspilot
      MYSQL_DATABASE: opspilot_foundation
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopspilot", "-popspilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10
    ports:
      - "4222:4222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opspilot
      MINIO_ROOT_PASSWORD: opspilot-secret
    ports:
      - "9000:9000"
      - "9001:9001"
