services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: opspilot
      MYSQL_DATABASE: opspilot_foundation
      MYSQL_USER: opspilot
      MYSQL_PASSWORD: opspilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopspilot", "-popspilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10
    ports:
      - "4222:4222"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opspilot
      MINIO_ROOT_PASSWORD: opspilot-secret
    ports:
      - "${OPSPILOT_MINIO_API_PORT:-9000}:9000"
      - "${OPSPILOT_MINIO_CONSOLE_PORT:-9001}:9001"

  foundation-minio:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "python -m pip install --no-cache-dir boto3 && python -m opspilot_foundation.server"
    environment:
      OPSPILOT_OBJECT_STORAGE_ADAPTER: minio
      OPSPILOT_S3_ENDPOINT_URL: http://minio:9000
      OPSPILOT_S3_BUCKET: opspilot-artifacts
      AWS_ACCESS_KEY_ID: opspilot
      AWS_SECRET_ACCESS_KEY: opspilot-secret
    ports:
      - "8080:8080"
    volumes:
      - ../../services/foundation-service:/app
    depends_on:
      - minio

volumes:
  mysql_data:
